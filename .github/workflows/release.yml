name: Release

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  archive:
    name: Build ${{ matrix.archive }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            archive: synapse-linux-x86_64.tar.gz
            bin: synapse

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build release binary
        run: cargo build --release -p cfs-synapse --bin synapse

      - name: Package Linux binary
        run: |
          mkdir -p dist
          cp target/release/synapse dist/synapse
          tar -C dist -czf "dist/${{ matrix.archive }}" synapse

      - name: Upload release archive
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ matrix.archive }}

  publish-crate:
    name: Publish crate
    runs-on: ubuntu-latest
    needs: archive
    if: vars.PUBLISH_CRATE == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Publish crates
        run: |
          publish_crate() {
            package="$1"
            for attempt in 1 2 3 4 5; do
              if cargo publish -p "$package" --token "${{ secrets.CARGO_REGISTRY_TOKEN }}"; then
                return 0
              fi
              echo "publish attempt ${attempt} failed for ${package}; waiting for registry/index propagation"
              sleep 30
            done
            return 1
          }

          publish_crate cfs-synapse-parser
          publish_crate cfs-synapse-codegen-cfs
          publish_crate cfs-synapse
