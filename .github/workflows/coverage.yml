name: Coverage

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  coverage:
    name: Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Install cargo-crap
        run: cargo install cargo-crap --locked

      - name: Generate coverage
        run: |
          cargo llvm-cov clean --workspace
          cargo llvm-cov \
            -p cfs-synapse-parser \
            -p cfs-synapse-codegen-cfs \
            -p cfs-synapse \
            -p synapse-integration-tests \
            -p synapse-rust-canary \
            --no-report
          mkdir -p site
          cp -R docs/. site/
          cargo llvm-cov report --html --output-dir site/coverage
          cp -R site/coverage/html/. site/coverage/
          rm -rf site/coverage/html
          cargo llvm-cov report --cobertura --output-path site/coverage/cobertura.xml
          cargo llvm-cov report --lcov --output-path site/coverage/lcov.info

      - name: Generate coverage badge data
        run: |
          rate=$(sed -n 's/.*line-rate="\([^"]*\)".*/\1/p' site/coverage/cobertura.xml | head -n1)
          percent=$(awk "BEGIN { printf \"%.1f\", $rate * 100 }")
          color=$(awk "BEGIN {
            if ($percent >= 90) print \"brightgreen\";
            else if ($percent >= 80) print \"yellowgreen\";
            else if ($percent >= 70) print \"yellow\";
            else if ($percent >= 60) print \"orange\";
            else print \"red\";
          }")
          cat > site/coverage/badge.json <<EOF
          {
            "schemaVersion": 1,
            "label": "coverage",
            "message": "${percent}%",
            "color": "${color}"
          }
          EOF
          test -f site/coverage/index.html
          test -f site/coverage/badge.json
          cat site/coverage/badge.json

      - name: Generate CRAP badge data
        run: |
          mkdir -p site/crap
          cargo crap --lcov site/coverage/lcov.info --format json --output site/crap/report.json
          python3 scripts/cargo_crap_badge.py site/crap/report.json site/crap/badge.json
          test -f site/crap/badge.json
          cat site/crap/badge.json

      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy-pages:
    name: Deploy Pages
    runs-on: ubuntu-latest
    needs: coverage
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
