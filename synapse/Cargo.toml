[package]
name = "cfs-synapse"
version.workspace = true
edition.workspace = true
description = "NASA cFS-friendly IDL and code generator for C headers and Rust repr(C) bindings"
repository = "https://github.com/sjbeskur/synapse"
readme = "../README.md"
license = "MIT OR Apache-2.0"
keywords = ["cfs", "nasa", "codegen", "idl", "embedded"]
categories = ["command-line-utilities", "development-tools::build-utils"]

[lib]
name = "cfs_synapse"
path = "src/lib.rs"

[[bin]]
name = "synapse"
path = "src/main.rs"

[dependencies]
synapse-parser      = { workspace = true }
synapse-codegen-cfs = { workspace = true }
clap                = { version = "4", features = ["derive"] }
pest                = "2"
toml                = "1"
